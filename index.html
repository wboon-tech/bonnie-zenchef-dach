:root{
  --teal:#368F8B; --teal-dark:#2c726e; --zc:#14303a;
  --wa:#25D366; --wa-dark:#1faa52; --wa-bub:#d9fdd3;
  --ink:#141414; --soft:#3f3f46; --muted:#7c7c86; --line:#e7e7ec;
  --paper:#ffffff; --bg:#f3f4f5;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif; background:#1b1a18; color:var(--ink); display:flex; align-items:center; justify-content:center; min-height:100vh; overflow:hidden}
#stage{position:relative; width:min(96vw, calc(96vh * 16 / 9)); height:min(96vh, calc(96vw * 9 / 16)); border-radius:16px; overflow:hidden; box-shadow:0 24px 80px rgba(0,0,0,.5)}
.slide{position:absolute; inset:0; padding:5.4% 6.2%; display:none; flex-direction:column; background:var(--bg)}
.slide.active{display:flex; animation:fade .4s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.g-neutral{background:linear-gradient(165deg,#f8f8f9 0%,#eceef0 100%)}
.g-peach{background:linear-gradient(158deg,#f8ede3 0%,#f0d3bc 55%,#e6b189 100%)}
.g-lilac{background:linear-gradient(158deg,#efe7f8 0%,#f5dcee 100%)}
.g-mint{background:linear-gradient(150deg,#d5d0f3 0%,#e2e0ee 45%,#eaeecf 100%)}
.g-sky{background:linear-gradient(158deg,#e4f0ef 0%,#eef0e6 55%,#f4ece2 100%)}

.serif{font-family:"Playfair Display",Georgia,serif}
.eyebrow{font-size:.98vw; letter-spacing:.16em; text-transform:uppercase; color:var(--teal-dark); font-weight:700; margin-bottom:1.5vh}
h1{font-family:"Playfair Display",serif; font-size:5vw; line-height:1.0; font-weight:700; letter-spacing:-.01em; color:var(--ink)}
h2{font-family:"Playfair Display",serif; font-size:3.4vw; line-height:1.04; font-weight:700; margin-bottom:2.2vh; color:var(--ink)}
.lead{font-size:1.35vw; line-height:1.5; color:var(--soft); font-weight:500; max-width:86%}
.big-sub{font-size:1.55vw; line-height:1.45; color:var(--soft); font-weight:500; margin-top:2vh; max-width:82%}
strong{color:var(--ink); font-weight:700}
.teal{color:var(--teal)} .wag{color:var(--wa-dark)} .zctxt{color:var(--zc)}

.lockup{display:flex; align-items:center; gap:1.1vw}
.divider{width:1px; height:3.2vh; background:rgba(0,0,0,.18)}
.zlogo{height:3.1vh; width:auto; color:var(--zc)}
.wabadge{display:inline-flex; align-items:center; gap:.55vw; background:var(--wa); color:#fff; padding:.8vh 1vw; border-radius:.7vw; font-weight:800; font-size:1.4vw; line-height:1}
.wabadge .waic{width:1.6vw; height:1.6vw; flex:none}
.topbar{position:absolute; top:5.4%; left:6.2%; right:6.2%; display:flex; justify-content:space-between; align-items:center}

.pagenum{position:absolute; left:6.2%; bottom:4.6%; font-size:.88vw; color:var(--muted); font-weight:600}
.fab{position:absolute; right:5.2%; bottom:4.6%; width:3vw; height:3vw; border-radius:50%; border:2px solid var(--ink); background:transparent; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); transition:.15s}
.fab:hover{background:var(--ink); color:#fff}
.fab svg{width:1.35vw; height:1.35vw}

.chips{display:flex; flex-wrap:wrap; gap:.85vw; margin-top:1.6vh; max-width:92%}
.chip{background:rgba(255,255,255,.7); border:1px solid rgba(0,0,0,.08); color:var(--soft); font-weight:600; font-size:1.02vw; padding:1vh 1.15vw; border-radius:999px}
.chip.wa{background:rgba(217,253,211,.85); border-color:rgba(37,211,102,.35); color:#12692f}

.cards{display:grid; gap:1.3vw; margin-top:1vh}
.cards.c2{grid-template-columns:1fr 1fr}
.cards.c3{grid-template-columns:1fr 1fr 1fr}
.card{background:rgba(255,255,255,.72); border:1px solid rgba(255,255,255,.9); border-radius:14px; padding:2.1vh 1.4vw; box-shadow:0 6px 20px rgba(0,0,0,.05)}
.card .k{font-size:.86vw; letter-spacing:.1em; text-transform:uppercase; color:var(--teal-dark); font-weight:700; margin-bottom:1vh}
.card h3{font-size:1.35vw; font-weight:700; margin-bottom:1vh}
.card p{font-size:1.02vw; line-height:1.45; color:var(--soft)}
.card ul{list-style:none; display:flex; flex-direction:column; gap:.8vh; margin-top:.3vh}
.card ul li{font-size:.98vw; color:var(--soft); padding-left:1.25vw; position:relative}
.card ul li::before{content:""; position:absolute; left:0; top:.62vh; width:.48vw; height:.48vw; border-radius:50%; background:var(--wa)}

.stats{display:flex; gap:2.6vw; margin-top:3vh}
.stat .n{font-family:"Playfair Display",serif; font-size:3.4vw; font-weight:700; color:var(--teal); line-height:1}
.stat .l{font-size:.95vw; color:var(--muted); font-weight:600; margin-top:.7vh}
.wmap-img{width:100%; max-height:46vh; object-fit:contain}
.cardic{width:2.1vw; height:2.1vw; object-fit:contain; display:block; margin-bottom:1.1vh}
.func .fi img{width:1.5vw; height:1.5vw; display:block}
.clabel{font-size:.85vw; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:1.2vh}
.clogostrip{display:flex; gap:2.3vw; align-items:center; flex-wrap:wrap}
.clogo{height:2.9vh; width:auto; filter:brightness(0); opacity:.4}
.intimg{width:100%; border-radius:16px; box-shadow:0 16px 44px rgba(0,0,0,.16); display:block}

.split{display:grid; grid-template-columns:1.1fr .9fr; gap:2.6vw; align-items:center; margin-top:1vh; flex:1}
.split.dir{grid-template-columns:1fr 1fr; align-items:start}
.dircol{background:rgba(255,255,255,.6); border:1px solid rgba(255,255,255,.9); border-radius:14px; padding:2.2vh 1.5vw}
.dircol h3{font-size:1.3vw; font-weight:700; margin-bottom:1.2vh; display:flex; align-items:center; gap:.6vw}
ul.checks{list-style:none; display:flex; flex-direction:column; gap:1.3vh}
ul.checks li{position:relative; padding-left:2.1vw; font-size:1.12vw; line-height:1.4; color:var(--soft)}
ul.checks li::before{content:""; position:absolute; left:0; top:.15vh; width:1.35vw; height:1.35vw; border-radius:50%; background:var(--wa)}
ul.checks li::after{content:""; position:absolute; left:.44vw; top:.5vh; width:.38vw; height:.68vw; border:solid #fff; border-width:0 .17vw .17vw 0; transform:rotate(45deg)}
.arrow-badge{display:inline-flex; align-items:center; justify-content:center; width:2.1vw; height:2.1vw; border-radius:8px; background:var(--wa); color:#fff; font-size:1.15vw; font-weight:800}
.funcs{display:flex; flex-direction:column; gap:1.6vh; margin-top:1vh}
.func{display:flex; gap:1vw; align-items:flex-start; font-size:1.18vw; line-height:1.35; color:var(--soft)}
.func .fi{flex:none; width:1.5vw; height:1.5vw; border-radius:7px; background:var(--teal-soft,#e6f0ef); color:var(--teal-dark); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.9vw; margin-top:.2vh}

.phone-num{display:inline-flex; align-items:center; gap:1vw; background:var(--ink); color:#fff; padding:2vh 2.2vw; border-radius:14px; font-size:2.4vw; font-weight:800}
.phone-num .dot{width:.85vw; height:.85vw; border-radius:50%; background:#4ade80; box-shadow:0 0 0 .42vw rgba(74,222,128,.28)}

.device{width:100%; max-width:19vw; aspect-ratio:9/18.5; background:#fff; border-radius:2.2vw; padding:.5vw; box-shadow:0 26px 60px rgba(0,0,0,.22); border:1px solid rgba(0,0,0,.06); margin:0 auto}
.device .scr{width:100%; height:100%; border-radius:1.8vw; overflow:hidden; display:flex; flex-direction:column; background:#e7ddd3}
.wa-hd{background:#f6f6f6; display:flex; align-items:center; gap:.6vw; padding:1.1vh .8vw}
.wa-hd .bk{color:var(--wa-dark); font-weight:700; font-size:1vw}
.wa-hd .av{width:1.9vw; height:1.9vw; border-radius:50%; background:#111; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.82vw}
.wa-hd .nm{font-size:.9vw; font-weight:700; line-height:1.1}
.wa-hd .st{font-size:.64vw; color:#8a8a8a}
.wa-body{flex:1; padding:1.3vh .9vw; display:flex; flex-direction:column; gap:1vh; background:#e5ddd4; overflow:hidden}
.bub{max-width:82%; padding:.85vh .8vw; border-radius:.8vw; font-size:.83vw; line-height:1.32; box-shadow:0 1px 1px rgba(0,0,0,.07)}
.bub.in{background:#fff; align-self:flex-start; border-top-left-radius:.2vw}
.bub.out{background:var(--wa-bub); align-self:flex-end; border-top-right-radius:.2vw}
.bub .tm{display:inline-block; font-size:.58vw; color:#7d8a80; margin-left:.5vw; transform:translateY(.2vh)}
.bub .tick{color:#34b7f1; font-weight:700}
.callscr{width:100%; height:100%; border-radius:1.8vw; overflow:hidden; background:linear-gradient(180deg,#1e6b52,#0f3f31); color:#fff; display:flex; flex-direction:column; align-items:center; padding:5vh 1vw 2vh; text-align:center}
.callscr .cav{width:5.5vw; height:5.5vw; border-radius:50%; background:rgba(255,255,255,.14); display:flex; align-items:center; justify-content:center; margin-bottom:2vh}
.callscr .cnm{font-size:1.4vw; font-weight:700}
.callscr .cst{font-size:.85vw; opacity:.8; margin-top:.6vh}
.callscr .capt{margin-top:auto; background:rgba(255,255,255,.12); border-radius:1vw; padding:1.4vh 1vw; font-size:.82vw; line-height:1.35}

.contact{display:grid; grid-template-columns:1fr 1fr; gap:2vw; margin-top:2vh}
.pcard{background:rgba(255,255,255,.75); border:1px solid rgba(255,255,255,.9); border-radius:16px; padding:3vh 1.8vw; box-shadow:0 8px 24px rgba(0,0,0,.06)}
.pcard .pn{font-family:"Playfair Display",serif; font-size:2vw; font-weight:700}
.pcard .pr{color:var(--teal-dark); font-weight:700; font-size:1vw; margin:.6vh 0 2vh}
.pcard .row{display:flex; align-items:center; gap:.7vw; font-size:1.12vw; color:var(--soft); margin-top:1.1vh}
.pcard .row b{color:var(--ink); font-weight:600}
.pcard .ic{width:1.5vw; height:1.5vw; border-radius:7px; background:var(--wa); color:#fff; display:flex; align-items:center; justify-content:center; font-size:.9vw; flex:none}

#notes{position:fixed; left:0; right:0; bottom:0; background:rgba(15,15,15,.97); color:#f4f2ee; padding:20px 28px; font-size:16px; line-height:1.55; max-height:40vh; overflow:auto; display:none; border-top:3px solid var(--wa); z-index:20}
#notes.show{display:block}
#notes h4{color:var(--wa); font-size:13px; letter-spacing:.14em; text-transform:uppercase; margin-bottom:8px}
#notes b{color:#fff} #notes .tag{color:#9fe3df; font-weight:700}
#lang{position:fixed; top:12px; left:50%; transform:translateX(-50%); display:flex; gap:6px; z-index:30}
#lang button{border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08); color:#cfc7bd; font-size:12px; font-weight:700; letter-spacing:.06em; padding:5px 11px; border-radius:999px; cursor:pointer}
#lang button.on{background:#fff; color:#141414; border-color:#fff}
#pdfbtn{position:fixed; top:11px; left:16px; z-index:31; display:inline-flex; align-items:center; gap:5px; background:var(--wa); color:#fff; font-size:12px; font-weight:700; letter-spacing:.04em; padding:6px 12px; border-radius:999px; text-decoration:none; border:1px solid rgba(0,0,0,.08)}
#pdfbtn:hover{background:var(--wa-dark)}
#hud{position:fixed; top:14px; right:18px; color:#d8cfc4; font-size:12px; letter-spacing:.08em; z-index:30}
#help{position:fixed; bottom:12px; left:18px; color:#8a827a; font-size:11px; z-index:30}
@media print{ body{background:#fff} #hud,#help,#notes,#lang,#pdfbtn{display:none} }
</style>
</head>
<body>
<div id="stage"></div>
<div id="lang"></div>
<a id="pdfbtn" href="#" target="_blank" rel="noopener">⬇ PDF</a>
<div id="hud"></div>
<div id="help"></div>
<div id="notes"></div>

function logo(color){ return `<span style="display:inline-flex;align-items:center;gap:.5vw;font-weight:700;font-size:1.85vw;color:${color}"><span style="display:inline-flex;height:1.05em;width:1.05em">${MARK}</span>bonnie</span>`; }
function lockup(){ return `<div class="lockup">${logo('#141414')}<span class="divider"></span>${ZLOGO}</div>`; }
function callscreen(name, st, capt){ return `<div class="device"><div class="scr"><div class="callscr"><div class="cav">${WAIC.replace('class="waic"','style="width:2.8vw;height:2.8vw"')}</div><div class="cnm">${name}</div><div class="cst">${st}</div><div class="capt">${capt}</div></div></div></div>`; }
function device(name, sub, rows){
  const av=name.trim()[0].toUpperCase();
  const body=rows.map(r=>`<div class="bub ${r.s}">${r.t}<span class="tm">${r.tm||''} ${r.tick?'<span class="tick">✓✓</span>':''}</span></div>`).join('');
  return `<div class="device"><div class="scr"><div class="wa-hd"><span class="bk">‹</span><div class="av">${av}</div><div><div class="nm">${name}</div><div class="st">${sub}</div></div></div><div class="wa-body">${body}</div></div></div>`;
}

const LOGOS=['loetje','moeke','dudok','ron','beppe','republiek','seapalace','zalmhuis','badhotel'];
function clogos(label){return `<div><div class="clabel">${label}</div><div class="clogostrip">${LOGOS.map(l=>`<img class="clogo" src="${ASSET[l]}" alt="">`).join('')}</div></div>`;}
function ic(n){return `<img class="cardic" src="${ASSET['ic-'+n]}" alt="">`;}

  s2:{eyebrow:"Wer wir sind", h2:'Bonnie beantwortet jeden Gast, <span class="wag">sofort</span>', lead:"Bonnie ist ein KI-Assistent, der für Restaurants, Gruppen und Hotels ans Telefon geht und auf WhatsApp antwortet. In der Sprache des Gastes, rund um die Uhr, und legt die Buchung direkt im Reservierungssystem an.", since:"Seit 2024 gewachsen auf:", st:[["1.000+","Restaurants live"],["16","Länder"],["20+","Sprachen"],["24/7","Tag und Nacht"]],
    notes:`<b>Wichard, ~2 min.</b> Die starke Intro: wer wir sind und was wir tun. Ein Gehirn, drei Kanäle (Telefon, WhatsApp, Widget). Zahlen selbstbewusst nennen. [Gründungsjahr noch eintragen.]`},
  s3:{eyebrow:"Wohin wir wollen", h2:'Die Kommunikations-Schicht für die <span class="teal">Hospitality</span>', lead:"Unser Ziel: Jeder Gast erreicht den Betrieb sofort, in jeder Sprache, auf jedem Kanal. Und jede Anfrage wird zu einer Handlung in euren Systemen, statt zu einer Nachricht, die jemand aufgreifen muss.", c:[["Heute","Sprache und WhatsApp, alles was den Gast erreicht, auf einem Gehirn."],["Jede Anfrage wird eine Handlung","Direkt in euren Systemen gebucht, nicht als To-do liegengelassen."],["Bereit für morgen","Wenn Gäste über KI entdecken und buchen, ist Bonnie die Infrastruktur dahinter."]],
    notes:`<b>Wichard, ~1-2 min.</b> Die Vision: Bonnie will die Kommunikations-Schicht der Hospitality sein. Nicht überversprechen, sondern die Richtung zeigen: Kommunikation übernehmen und über die Systeme handeln.`},
  s4:{eyebrow:"Bevor wir erklären, hört selbst", h2:'Lernt Bonnie in <span class="wag">zwei Minuten</span> kennen', lead:"Statt lange zu reden, rufen wir sie jetzt einfach an. So versteht ihr sofort, was wir meinen.", cst:"Anruf verbunden · 00:12", capt:"\"Guten Tag, hier ist das Restaurant. Für wie viele Personen darf ich reservieren?\"",
    notes:`<b>beide, ~2-3 min · Aha-Moment.</b> Gianni wählt auf Lautsprecher, ganz normale Reservierungsanfrage. Danach: "Das war ein echter Anruf in ein echtes System, so läuft es bei über 1.000 Restaurants." Technik vorher testen, Aufnahme als Backup.`},
  s5:{eyebrow:"Warum wir heute hier sind", h2:'Eine Partnerschaft, die in <span class="wag">beide Richtungen</span> läuft', lead:"Mit Zenchef Niederlande arbeiten wir längst so zusammen: wir schicken uns gegenseitig die passenden Gäste zu. Genau das wollen wir mit euch im DACH-Raum aufbauen.", lt:"Wir schicken euch", li:["Betriebe, die mit ihrem aktuellen System unzufrieden sind oder wechseln wollen","Restaurants, die aktiv ein Reservierungssystem suchen"], rt:"Ihr schickt uns", ri:["Kunden, die nach Voice-AI oder einem Telefon-Assistenten fragen","Betriebe, die WhatsApp-Buchungen oder 24/7-Erreichbarkeit wollen"],
    notes:`<b>Gianni, ~2 min.</b> Wichtigste Botschaft: What's in it for you. NL-Beispiel erzählen. Kernsatz: "Ihr müsst Bonnie nicht verkaufen, ihr müsst es nur erkennen und rüberreichen."`},
  s6:{eyebrow:"Warum es zählt", h2:'Jeder verpasste Anruf ist <span class="wag">verlorenes Geld</span>', c:[["Das Telefon stört den Service","Das Team jongliert im Ansturm zwischen Gastraum und Hörer, und die gleichen Fragen kommen immer wieder."],["Nach Feierabend hört es nie auf","Nächte, Wochenenden, Feiertage, genau dann bleiben Anrufe unbeantwortet."],["Ein verpasster Anruf, eine verlorene Buchung","Keine Reservierung, kein Gast. Das Geld geht lautlos zur Konkurrenz."],["No-Shows kosten doppelt","Bestätigungen und Erinnerungen bleiben liegen, wenn das Team beschäftigt ist."]],
    notes:`<b>Gianni, ~2 min.</b> Kurz und schmerzhaft, ein Alltagsbeispiel. Überleitung: "Genau dafür ist Bonnie gebaut, von Tag eins für die Gastronomie."`},
  s7:{eyebrow:"Was Bonnie übernimmt", h2:'Ein Restaurant, das rund um die Uhr <span class="wag">antwortet</span>', f:["Nimmt jeden Anruf an, in der Sprache des Gastes","Bucht, ändert und storniert direkt in eurem System","WhatsApp und Website-Widget auf demselben Gehirn","Transkript, Zusammenfassung und Zufriedenheit im Dashboard"], dev:["Café Amsterdam","Business account",[{s:'out',t:'Kann ich heute Abend einen Tisch für 9 Personen um 20 Uhr buchen?',tm:'09:23',tick:true},{s:'in',t:'Sehr gern. Lieber auf der Terrasse oder drinnen?',tm:'09:23'},{s:'out',t:'Terrasse, bitte',tm:'09:24',tick:true},{s:'in',t:'Erledigt. Tisch für 9 um 20 Uhr auf der Terrasse ist bestätigt.',tm:'09:24'}]],
    notes:`<b>Wichard, ~3 min.</b> Vier Blöcke als Geschichte: annehmen, buchen, nachfassen, messen. Betonen: schreibt in Echtzeit ins bestehende System. Ehrlich: keine Bestellungen am Telefon, dafür Bestelllink per WhatsApp.`},
  s8:{eyebrow:"Die entscheidende Folie für Zenchef", h2:'Bonnie sitzt <span class="teal">auf Zenchef</span>', lead:'Wir konkurrieren nicht mit euch, wir bauen auf euch auf. Bonnie verbindet sich direkt mit Zenchef und legt Buchungen live in eurem System an. <strong>Formitable, heute Teil von Zenchef, ist unsere umfassendste Integration überhaupt.</strong>', c:[["Volle Integration","Erstellen, ändern, stornieren und die Buchung per Telefon finden, alles direkt in Zenchef."],["Macht Zenchef klebriger","Der Betrieb ist plötzlich 24/7 erreichbar und verliert weniger Buchungen. Das System wird unverzichtbar."],["Weniger Churn für euch","Ein Betrieb, der mehr aus Zenchef holt, wechselt seltener. Bonnie zahlt auf eure Retention ein."]],
    notes:`<b>Wichard, ~2 min · WICHTIGSTE Folie.</b> "Wir sind keine Konkurrenz, wir sind eine Schicht obendrauf." Formitable ist ihre Familie und unsere tiefste Integration. Business-Case für Zenchef: klebriger, weniger Churn.`},
  s9:{eyebrow:"Für euer Setup gebaut", h2:'Ein System, <span class="wag">drei Wege</span> es zu betreiben', c:[["1 · Einzelne Restaurants","Fängt die Anrufe ab, das Team bleibt bei den Gästen. Arbeitet nachts, am Wochenende, in Stoßzeiten."],["2 · Gruppen","Cross-Selling eingebaut: ist ein Standort ausgebucht, verweist Bonnie auf einen Schwesterstandort. Ein Dashboard über alle Häuser."],["3 · Hotels","Beantwortet Gästeanrufe in deren Sprache und qualifiziert Veranstaltungsanfragen. PMS (Mews, Shiji) auf der Roadmap."]],
    notes:`<b>Gianni, ~2 min.</b> Schnell durchgehen, sie sollen ihre eigenen Kunden wiedererkennen. Stärkstes Argument: Cross-Selling für Gruppen. Interaktiv: "Wie viele eurer Kunden sind Gruppen?"`},
  types:{eyebrow:"Für jede Art von Betrieb", h2:'Vom <span class="wag">Beachclub</span> bis zum Fine Dining', lead:"Bonnie ist kein Tool für einen Typ Betrieb. Ob lockerer Strandclub oder Sterneküche, Bonnie passt Ton, Sprache und Wissen an jeden Betrieb an.", list:["Beachclubs & Strandbars","Fine Dining","Biergärten","Bistros & Brasserien","Cafés","Pizzerien & Trattorien","Hotelrestaurants","Eventlocations & Gruppen"], foot:"Jeder Betrieb behält seinen eigenen Ton, sein Menü und sein Wissen.",
    notes:`<b>Gianni, ~1-2 min.</b> Breite zeigen: Bonnie passt zu jedem Betrieb. Kontrast nennen: Beachclub mit hohem Sommervolumen vs. Fine Dining mit sensiblem Ton und Allergenen vs. Biergarten mit großen Gruppen. Kernsatz: "Egal welcher eurer Kunden, Bonnie passt sich an."`},
  setup:{eyebrow:"Flexible Einrichtung", h2:'Bonnie springt genau dann ein, <span class="wag">wenn ihr wollt</span>', lead:"Ihr entscheidet, wann Bonnie ans Telefon geht. Vom kompletten Empfang bis zum stillen Backup im Hintergrund.", c:[["Immer erreichbar","Bonnie nimmt jeden Anruf entgegen und ist die erste Stimme, die der Gast hört."],["Verzögerte Weiterleitung","Das Team hat Vorrang: Bonnie übernimmt erst, wenn nach z.B. 10 Sekunden niemand abnimmt."],["Nur außerhalb der Öffnungszeiten","Bonnie geht nur ans Telefon, wenn der Betrieb geschlossen ist: nachts, am Ruhetag, im Urlaub."]],
    notes:`<b>Wichard, ~2 min.</b> Wichtig für Skeptiker: Bonnie ersetzt das Team nicht, es fängt nur ab, was sonst verloren geht. Verzögerte Weiterleitung betonen (z.B. 10 Sekunden): das Team bleibt an erster Stelle. Nimmt die Angst vor "die KI nimmt uns die Gäste weg".`},
  s10:{eyebrow:"Nochmal live, jetzt ihr", h2:'Bringt Bonnie <span class="wag">an ihre Grenzen</span>', lead:"Jetzt kennt ihr Bonnie. Diesmal stellt ihr die Fragen: mitten im Gespräch die Sprache wechseln, Sonderfälle, fiese Fragen.", chips:["Mitten im Satz auf Englisch wechseln","\"Sind Sie behindertengerecht?\"","Große Gruppe anfragen"], cst:"Anruf verbunden · Sprache erkannt", capt:"Stellt eure schwierigste Gastfrage. Bonnie wechselt die Sprache automatisch mit.",

  s11:{eyebrow:"Der konkrete nächste Schritt", h2:'So erkennt ihr einen <span class="wag">Bonnie-Lead</span>', lead:"Ihr müsst nichts verkaufen. Hört ihr eines dieser Signale, reicht ihr den Kontakt an uns weiter. Wir übernehmen ab da alles.", chips:["\"Wir kommen ans Telefon nicht mehr hinterher\"","\"Gibt es sowas wie Voice-AI?\"","\"Wir wollen Buchungen über WhatsApp\"","\"Abends geht keiner ran\"","\"Wir haben viele No-Shows\"","\"Können Gäste rund um die Uhr buchen?\""], c:[["So geht die Übergabe","Name und Betrieb kurz an uns (Slack-Kanal / WhatsApp-Gruppe, richten wir gemeinsam ein). Oder direkt die Demo-Nummer weitergeben."],["Was ihr von uns bekommt","Wir melden zurück, was aus dem Lead wurde, und schicken euch umgekehrt Betriebe, die ein Reservierungssystem suchen oder wechseln wollen."]],

  s13:{h1:"Danke. Probiert es aus.", lead:"Live-Demo anrufen, auf WhatsApp anschreiben, oder Leads teilen.",

en:{
  name:"English", help:"← → / Space = next · N = notes · F = fullscreen · L = language",
  s1:{eyebrow:"The AI phone & WhatsApp assistant for hospitality", tr:"DACH · Zenchef Team", title:'Bonnie <span class="teal">×</span> Zenchef', sub:"Answer every call, day and night, in the guest's language. And create the booking straight into Zenchef.", chip:"Questions welcome anytime, just jump in", p1:"Wichard Boon", r1:"Head of GTM · Bonnie", p2:"Gianni Lechner", r2:"Country Representative DACH",
    trust:"Trusted by leading venues across Europe",
    notes:`<b>both, ~2 min.</b> Introduce yourselves. One-line pitch: "Bonnie is the AI phone & WhatsApp assistant for restaurants, and we sit right on top of Zenchef." Set the format: questions anytime, and we'll call Bonnie live in a moment.`},
  s2:{eyebrow:"Who we are", h2:'Bonnie answers every guest, <span class="wag">instantly</span>', lead:"Bonnie is an AI assistant that picks up the phone and answers on WhatsApp for restaurants, groups and hotels. In the guest's language, around the clock, creating the booking straight into the reservation system.", since:"Since 2024, grown to:", st:[["1,000+","restaurants live"],["16","countries"],["20+","languages"],["24/7","day and night"]],
    notes:`<b>Wichard, ~2 min.</b> The strong intro: who we are and what we do. One brain, three channels. State the numbers with confidence. [Add founding year.]`},
  s3:{eyebrow:"Where we're headed", h2:'The communication layer for <span class="teal">hospitality</span>', lead:"Our goal: every guest reaches the venue instantly, in any language, on any channel. And every request becomes an action inside your systems, instead of a message someone has to pick up.", c:[["Today","Voice and WhatsApp, everything that reaches the guest, on one brain."],["Every request becomes an action","Booked straight into your systems, not left as a to-do."],["Ready for what's next","When guests discover and book through AI, Bonnie is the infrastructure behind it."]],
    notes:`<b>Wichard, ~1-2 min.</b> The vision: Bonnie as the communication layer for hospitality. Don't over-promise, show the direction: handle communication and act across the systems.`},
  s4:{eyebrow:"Before we explain, hear it yourself", h2:'Meet Bonnie in <span class="wag">two minutes</span>', lead:"Instead of talking, let's just call her now. You'll get it in seconds.", cst:"Call connected · 00:12", capt:"\"Hello, this is the restaurant. For how many people may I book the table?\"",
    notes:`<b>both, ~2-3 min · the aha moment.</b> Dial on speaker, a normal booking request. Then: "That was a real call into a real system, this runs at 1,000+ restaurants." Test the tech first, keep a recording as backup.`},
  s5:{eyebrow:"Why we're here today", h2:'A partnership that runs <span class="wag">both ways</span>', lead:"We already work this way with Zenchef Netherlands: we send each other the right leads. That's exactly what we want to build with you in DACH.", lt:"We send you", li:["Venues unhappy with their current system or looking to switch","Restaurants actively shopping for a reservation system"], rt:"You send us", ri:["Customers asking about voice AI or a phone assistant","Venues that want WhatsApp bookings or 24/7 availability"],
    notes:`<b>Gianni, ~2 min.</b> The key message: what's in it for you. Tell the NL example. Core line: "You don't have to sell Bonnie, you just have to spot it and hand it over."`},
  s6:{eyebrow:"Why it matters", h2:'Every missed call is <span class="wag">lost revenue</span>', c:[["The phone disrupts service","The team juggles the dining room and the handset during the rush, and the same questions never stop."],["After hours it never stops","Nights, weekends, holidays, exactly when calls go unanswered."],["A missed call, a lost booking","No reservation, no guest. The money quietly goes to the competition."],["No-shows cost twice","Confirmations and reminders slip when the team is busy."]],
    notes:`<b>Gianni, ~2 min.</b> Keep it short and painful, one everyday example. Bridge: "That's exactly what Bonnie is built for, from day one for hospitality."`},
  s7:{eyebrow:"What Bonnie handles", h2:'A restaurant that answers <span class="wag">around the clock</span>', f:["Answers every call, in the guest's language","Books, changes and cancels straight in your system","WhatsApp and website widget on the same brain","Transcript, summary and satisfaction in the dashboard"], dev:["Café Amsterdam","Business account",[{s:'out',t:'Can I book a table for 9 tonight at 8pm?',tm:'09:23',tick:true},{s:'in',t:'Of course. Terrace or inside?',tm:'09:23'},{s:'out',t:'Terrace, please',tm:'09:24',tick:true},{s:'in',t:'Done. Table for 9 at 8pm on the terrace is confirmed.',tm:'09:24'}]],
    notes:`<b>Wichard, ~3 min.</b> Four blocks as a story: answer, book, follow up, measure. Stress: writes into the existing system in real time. Be honest: no orders by phone, it sends the order link on WhatsApp.`},
  s8:{eyebrow:"The slide that matters for Zenchef", h2:'Bonnie sits <span class="teal">on top of Zenchef</span>', lead:'We don\'t compete with you, we build on you. Bonnie connects directly to Zenchef and creates bookings live in your system. <strong>Formitable, now part of Zenchef, is our most complete integration of all.</strong>', c:[["Full integration","Create, change, cancel and find the booking by phone, all straight in Zenchef."],["Makes Zenchef stickier","The venue is suddenly reachable 24/7 and loses fewer bookings. The system becomes indispensable."],["Less churn for you","A venue that gets more out of Zenchef switches less. Bonnie feeds your retention."]],
    notes:`<b>Wichard, ~2 min · THE key slide.</b> "We're not competition, we're a layer on top." Formitable is their own family and our deepest integration. Business case for Zenchef: stickier, less churn.`},
  s9:{eyebrow:"Built for your setup", h2:'One system, <span class="wag">three ways</span> to run it', c:[["1 · Single restaurants","Catches the calls so the team stays with the guests. Works nights, weekends, peaks."],["2 · Groups","Cross-selling built in: if one location is full, Bonnie points to a sister venue. One dashboard across all of them."],["3 · Hotels","Answers guest calls in their language and qualifies event requests. PMS (Mews, Shiji) on the roadmap."]],
    notes:`<b>Gianni, ~2 min.</b> Move fast, let them recognise their own customers. Strongest point: cross-selling for groups. Make it interactive: "How many of your customers are groups?"`},
  types:{eyebrow:"For every kind of venue", h2:'From <span class="wag">beach club</span> to fine dining', lead:"Bonnie isn't built for one type of venue. From a laid-back beach club to a Michelin kitchen, Bonnie adapts tone, language and knowledge to each one.", list:["Beach clubs & bars","Fine dining","Beer gardens","Bistros & brasseries","Cafés","Pizzerias & trattorias","Hotel restaurants","Event venues & groups"], foot:"Every venue keeps its own tone, menu and knowledge.",
    notes:`<b>Gianni, ~1-2 min.</b> Show the breadth: Bonnie fits any venue. Give a contrast: a high-volume summer beach club vs. fine dining with a careful tone and allergens vs. a beer garden with large groups. Core line: "Whichever of your customers, Bonnie adapts."`},
  setup:{eyebrow:"Flexible setup", h2:'Bonnie steps in exactly <span class="wag">when you want</span>', lead:"You decide when Bonnie takes the call. From full reception to a silent backup in the background.", c:[["Always on","Bonnie answers every call and is the first voice the guest hears."],["Delayed forwarding","Your team comes first: Bonnie only takes over when nobody picks up within, say, 10 seconds."],["Outside opening hours only","Bonnie only answers when the venue is closed: nights, days off, holidays."]],
    notes:`<b>Wichard, ~2 min.</b> Important for sceptics: Bonnie doesn't replace the team, it just catches what would otherwise be lost. Stress delayed forwarding (e.g. 10 seconds): the team stays first in line. Removes the fear of "the AI takes our guests away".`},
  s10:{eyebrow:"Live again, your turn", h2:'Push Bonnie <span class="wag">to her limits</span>', lead:"Now you know Bonnie. This time you ask the questions: switch language mid-call, edge cases, tricky questions.", chips:["Switch to English mid-sentence","\"Are you wheelchair accessible?\"","Request a large group"], cst:"Call connected · language detected", capt:"Ask your hardest guest question. Bonnie switches language automatically.",
    notes:`<b>both, ~3-4 min · the centrepiece.</b> Let the audience call out the questions. If something hiccups, stay calm: "that's exactly why we do this live." Keep a backup recording.`},
  s11:{eyebrow:"The concrete next step", h2:'How to spot a <span class="wag">Bonnie lead</span>', lead:"You don't have to sell anything. If you hear one of these signals, hand the contact to us. We take it from there.", chips:["\"We can't keep up with the phone\"","\"Is there something like voice AI?\"","\"We want bookings over WhatsApp\"","\"Nobody answers in the evening\"","\"We get a lot of no-shows\"","\"Can guests book around the clock?\""], c:[["How the handover works","Name and venue to us (Slack channel / WhatsApp group, we'll set it up together). Or just pass on the demo number."],["What you get back","We report what came of the lead, and send you venues shopping for or switching reservation systems."]],
    notes:`<b>Gianni, ~2 min · the real call-to-action.</b> Read the signal chips out loud. Agree the handover path first. Close the loop on reciprocity: "we return the favour with switchers and system shoppers."`},
  s12:{eyebrow:"Get in touch", h2:"Contact", note:"For leads we'll set up a quick channel together: a Slack channel or a WhatsApp group.",
    notes:`<b>both.</b> Swap contacts and set up the handover channel while everyone is still in the room.`},
  s13:{h1:"Thank you. Give it a try.", lead:"Call the live demo, message on WhatsApp, or share leads.",
    notes:`<b>both.</b> Leave the number up. Closing line: "Save the number, call it yourself tonight, and think of us next time a customer is fed up with their phone."`}
},
nl:{
  name:"Nederlands", help:"← → / Spatie = verder · N = spreektekst · F = volledig scherm · L = taal",
  s1:{eyebrow:"De AI telefoon- & WhatsApp-assistent voor de horeca", tr:"DACH · Zenchef Team", title:'Bonnie <span class="teal">×</span> Zenchef', sub:"Elke oproep beantwoorden, dag en nacht, in de taal van de gast. En de boeking direct in Zenchef zetten.", chip:"Vragen mogen altijd, roep er gerust doorheen", p1:"Wichard Boon", r1:"Head of GTM · Bonnie", p2:"Gianni Lechner", r2:"Country Representative DACH",
    trust:"Vertrouwd door toonaangevende zaken in heel Europa",
    notes:`<b>samen, ~2 min.</b> Stel jezelf voor. Eén-zin-pitch: "Bonnie is de AI telefoon- & WhatsApp-assistent voor restaurants, en we zitten bovenop Zenchef." Kondig het format aan: vragen mogen altijd, en zo bellen we Bonnie live.`},
  s2:{eyebrow:"Wie we zijn", h2:'Bonnie beantwoordt elke gast, <span class="wag">direct</span>', lead:"Bonnie is een AI-assistent die voor restaurants, groepen en hotels de telefoon opneemt en op WhatsApp antwoordt. In de taal van de gast, dag en nacht, en zet de boeking direct in het reserveringssysteem.", since:"Sinds 2024 gegroeid naar:", st:[["1.000+","restaurants live"],["16","landen"],["20+","talen"],["24/7","dag en nacht"]],
    notes:`<b>Wichard, ~2 min.</b> De sterke intro: wie we zijn en wat we doen. Eén brein, drie kanalen. Noem de cijfers met zelfvertrouwen. [Oprichtingsjaar nog invullen.]`},
  s3:{eyebrow:"Waar we naartoe willen", h2:'De communicatielaag voor de <span class="teal">horeca</span>', lead:"Ons doel: elke gast bereikt de zaak direct, in elke taal, op elk kanaal. En elke aanvraag wordt een handeling in jullie systemen, in plaats van een bericht dat iemand moet oppakken.", c:[["Vandaag","Voice en WhatsApp, alles wat de gast bereikt, op één brein."],["Elke aanvraag wordt een handeling","Direct in jullie systemen geboekt, niet als to-do blijven liggen."],["Klaar voor morgen","Als gasten via AI ontdekken en boeken, is Bonnie de infrastructuur erachter."]],
    notes:`<b>Wichard, ~1-2 min.</b> De visie: Bonnie als communicatielaag voor de horeca. Niet overpromisen, wel de richting laten zien: communicatie overnemen en handelen over de systemen.`},
  s4:{eyebrow:"Voordat we uitleggen, hoor het zelf", h2:'Maak in <span class="wag">twee minuten</span> kennis met Bonnie', lead:"In plaats van praten bellen we haar nu gewoon. Dan snap je meteen wat we bedoelen.", cst:"Verbonden · 00:12", capt:"\"Goedendag, u spreekt met het restaurant. Voor hoeveel personen mag ik reserveren?\"",
    notes:`<b>samen, ~2-3 min · aha-moment.</b> Gianni belt op de speaker, een normale reserveringsaanvraag. Daarna: "Dat was een echt gesprek in een echt systeem, zo draait het bij 1.000+ restaurants." Techniek vooraf testen, opname als back-up.`},
  s5:{eyebrow:"Waarom we hier zijn", h2:'Een partnerschap dat <span class="wag">twee kanten op</span> werkt', lead:"Met Zenchef Nederland werken we al zo samen: we sturen elkaar de juiste leads. Precies dat willen we met jullie in DACH opbouwen.", lt:"Wij sturen jullie", li:["Zaken die ontevreden zijn over hun huidige systeem of willen wisselen","Restaurants die actief een reserveringssysteem zoeken"], rt:"Jullie sturen ons", ri:["Klanten die vragen naar voice-AI of een telefoon-assistent","Zaken die WhatsApp-boekingen of 24/7-bereikbaarheid willen"],
    notes:`<b>Gianni, ~2 min.</b> De kernboodschap: what's in it for you. Vertel het NL-voorbeeld. Kernzin: "Je hoeft Bonnie niet te verkopen, je hoeft het alleen te herkennen en door te geven."`},
  s6:{eyebrow:"Waarom het telt", h2:'Elke gemiste oproep is <span class="wag">verloren omzet</span>', c:[["De telefoon stoort de service","Het team jongleert tijdens de drukte tussen de zaal en de hoorn, en dezelfde vragen blijven komen."],["Na sluitingstijd stopt het nooit","Nachten, weekenden, feestdagen, juist dan blijven oproepen onbeantwoord."],["Een gemiste oproep, een verloren boeking","Geen reservering, geen gast. Het geld gaat stilletjes naar de concurrent."],["No-shows kosten dubbel","Bevestigingen en herinneringen blijven liggen als het team druk is."]],
    notes:`<b>Gianni, ~2 min.</b> Kort en pijnlijk, één alledaags voorbeeld. Brug: "Precies daarvoor is Bonnie gebouwd, vanaf dag één voor de horeca."`},
  s7:{eyebrow:"Wat Bonnie overneemt", h2:'Een restaurant dat <span class="wag">dag en nacht</span> antwoordt', f:["Neemt elke oproep aan, in de taal van de gast","Boekt, wijzigt en annuleert direct in jullie systeem","WhatsApp en website-widget op hetzelfde brein","Transcript, samenvatting en tevredenheid in het dashboard"], dev:["Café Amsterdam","Business account",[{s:'out',t:'Kan ik vanavond een tafel voor 9 personen om 20u boeken?',tm:'09:23',tick:true},{s:'in',t:'Zeker. Liever op het terras of binnen?',tm:'09:23'},{s:'out',t:'Terras, graag',tm:'09:24',tick:true},{s:'in',t:'Gelukt. Tafel voor 9 om 20u op het terras is bevestigd.',tm:'09:24'}]],
    notes:`<b>Wichard, ~3 min.</b> Vier blokken als verhaal: opnemen, boeken, opvolgen, meten. Benadruk: schrijft realtime in het bestaande systeem. Eerlijk: geen bestellingen via de telefoon, wel de bestellink via WhatsApp.`},
  s8:{eyebrow:"De slide die telt voor Zenchef", h2:'Bonnie zit <span class="teal">bovenop Zenchef</span>', lead:'We concurreren niet met jullie, we bouwen op jullie voort. Bonnie koppelt direct met Zenchef en zet boekingen live in jullie systeem. <strong>Formitable, nu onderdeel van Zenchef, is onze meest volledige integratie.</strong>', c:[["Volledige integratie","Aanmaken, wijzigen, annuleren en de boeking telefonisch terugvinden, allemaal direct in Zenchef."],["Maakt Zenchef plakkeriger","De zaak is opeens 24/7 bereikbaar en verliest minder boekingen. Het systeem wordt onmisbaar."],["Minder churn voor jullie","Een zaak die meer uit Zenchef haalt, wisselt minder snel. Bonnie werkt aan jullie retentie."]],
    notes:`<b>Wichard, ~2 min · BELANGRIJKSTE slide.</b> "We zijn geen concurrent, we zijn een laag erbovenop." Formitable is hun familie en onze diepste integratie. Business-case voor Zenchef: plakkeriger, minder churn.`},
  s9:{eyebrow:"Gebouwd voor jullie setup", h2:'Eén systeem, <span class="wag">drie manieren</span> om het te draaien', c:[["1 · Losse restaurants","Vangt de oproepen op zodat het team bij de gasten blijft. Werkt 's nachts, in het weekend, tijdens pieken."],["2 · Groepen","Cross-selling ingebouwd: is een locatie vol, dan verwijst Bonnie naar een zusterlocatie. Eén dashboard over alle zaken."],["3 · Hotels","Beantwoordt gastoproepen in hun taal en kwalificeert evenementaanvragen. PMS (Mews, Shiji) op de roadmap."]],
    notes:`<b>Gianni, ~2 min.</b> Snel doorlopen, laat ze hun eigen klanten herkennen. Sterkste punt: cross-selling voor groepen. Maak het interactief: "Hoeveel van jullie klanten zijn groepen?"`},
  types:{eyebrow:"Voor elke soort zaak", h2:'Van <span class="wag">beachclub</span> tot fine dining', lead:"Bonnie is niet gebouwd voor één type zaak. Van een relaxte strandclub tot een sterrenkeuken, Bonnie past toon, taal en kennis aan elke zaak aan.", list:["Beachclubs & strandtenten","Fine dining","Biertuinen","Bistro's & brasserieën","Cafés","Pizzeria's & trattoria's","Hotelrestaurants","Eventlocaties & groepen"], foot:"Elke zaak houdt zijn eigen toon, menu en kennis.",
    notes:`<b>Gianni, ~1-2 min.</b> Laat de breedte zien: Bonnie past bij elke zaak. Geef een contrast: een drukke strandclub in de zomer vs. fine dining met gevoelige toon en allergenen vs. een biertuin met grote groepen. Kernzin: "Welke klant dan ook, Bonnie past zich aan."`},
  setup:{eyebrow:"Flexibele inrichting", h2:'Bonnie springt precies in <span class="wag">wanneer jullie willen</span>', lead:"Jullie bepalen wanneer Bonnie de telefoon opneemt. Van volledige receptie tot stille back-up op de achtergrond.", c:[["Altijd bereikbaar","Bonnie neemt elke oproep aan en is de eerste stem die de gast hoort."],["Vertraagde doorschakeling","Het team gaat voor: Bonnie neemt pas over als er na bijv. 10 seconden niemand opneemt."],["Alleen buiten openingstijden","Bonnie neemt alleen op als de zaak gesloten is: 's nachts, op rustdagen, tijdens vakantie."]],
    notes:`<b>Wichard, ~2 min.</b> Belangrijk voor sceptici: Bonnie vervangt het team niet, het vangt alleen op wat anders verloren gaat. Benadruk vertraagde doorschakeling (bijv. 10 seconden): het team blijft eerste. Neemt de angst weg van "de AI pakt onze gasten af".`},
  s10:{eyebrow:"Nog een keer live, nu jullie", h2:'Daag Bonnie <span class="wag">uit</span>', lead:"Nu ken je Bonnie. Deze keer stel je de vragen: midden in het gesprek van taal wisselen, randgevallen, lastige vragen.", chips:["Halverwege naar het Engels wisselen","\"Zijn jullie rolstoeltoegankelijk?\"","Een grote groep aanvragen"], cst:"Verbonden · taal herkend", capt:"Stel je moeilijkste gastvraag. Bonnie wisselt automatisch mee van taal.",
    notes:`<b>samen, ~3-4 min · het hoogtepunt.</b> Laat het publiek de vragen roepen. Hapert er iets, blijf rustig: "precies daarom doen we dit live." Houd een back-up-opname klaar.`},
  s11:{eyebrow:"De concrete volgende stap", h2:'Zo herken je een <span class="wag">Bonnie-lead</span>', lead:"Je hoeft niets te verkopen. Hoor je een van deze signalen, geef het contact dan aan ons door. Wij nemen het vanaf daar over.", chips:["\"We komen niet meer aan de telefoon toe\"","\"Bestaat er zoiets als voice-AI?\"","\"We willen boekingen via WhatsApp\"","\"'s Avonds neemt niemand op\"","\"We hebben veel no-shows\"","\"Kunnen gasten 24/7 boeken?\""], c:[["Zo werkt de overdracht","Naam en zaak kort naar ons (Slack-kanaal / WhatsApp-groep, zetten we samen op). Of geef gewoon het demonummer door."],["Wat je terugkrijgt","We koppelen terug wat er van de lead kwam, en sturen jullie omgekeerd zaken die een reserveringssysteem zoeken of willen wisselen."]],
    notes:`<b>Gianni, ~2 min · de echte call-to-action.</b> Lees de signaal-chips hardop voor. Spreek de overdrachtsroute vooraf af. Sluit de wederkerigheid: "wij doen wat terug met wisselaars en systeemzoekers."`},
  s12:{eyebrow:"Neem contact op", h2:"Contact", note:"Voor leads zetten we samen een korte route op: een Slack-kanaal of een WhatsApp-groep.",
    notes:`<b>samen.</b> Wissel contacten uit en zet het overdrachtskanaal op terwijl iedereen er nog is.`},
  s13:{h1:"Bedankt. Probeer het uit.", lead:"Bel de live-demo, stuur een WhatsApp, of deel leads.",
    notes:`<b>samen.</b> Laat het nummer groot staan. Slotzin: "Sla het nummer op, bel het vanavond zelf, en denk aan ons bij de volgende klant met telefoon-frustratie."`}
}

/* ================= slide builders ================= */
function pcard(p){ return `<div class="pcard"><div class="pn">${p.name}</div><div class="pr">${p.role}</div>
  <div class="row"><span class="ic">✉</span><b>${p.mail}</b></div>
  <div class="row"><span class="ic">✆</span><b>${p.tel}</b></div></div>`; }

const SLIDES = [
  {g:'g-neutral', b:s=>`<div class="topbar">${lockup()}<span class="eyebrow" style="margin:0">${s.s1.tr}</span></div>
    <div style="margin:auto 0; padding-top:3vh">
      <div class="eyebrow">${s.s1.eyebrow}</div><h1>${s.s1.title}</h1>
      <p class="big-sub">${s.s1.sub}</p>
      <div class="chips"><span class="chip wa">${s.s1.chip}</span></div></div>
    ${clogos(s.s1.trust)}
    <div style="display:flex; gap:3vw; align-items:flex-end; margin-top:3vh">
      <div><div style="font-family:'Playfair Display',serif;font-size:1.6vw;font-weight:700">${s.s1.p1}</div><div style="color:var(--muted);font-weight:600;font-size:.95vw">${s.s1.r1}</div></div>
      <div><div style="font-family:'Playfair Display',serif;font-size:1.6vw;font-weight:700">${s.s1.p2}</div><div style="color:var(--muted);font-weight:600;font-size:.95vw">${s.s1.r2}</div></div></div>`, n:s=>s.s1.notes},

  {g:'g-lilac', b:s=>`<div class="eyebrow">${s.s2.eyebrow}</div><h2>${s.s2.h2}</h2>
    <p class="lead" style="max-width:80%">${s.s2.lead}</p>
    <div style="display:flex; gap:2.5vw; align-items:center; flex:1; margin-top:2vh">
      <div style="flex:0 0 40%">
        <div style="font-weight:600;color:var(--muted);font-size:1vw">${s.s2.since}</div>
        <div class="stats" style="margin-top:1.4vh; gap:1.8vw; flex-wrap:wrap">${s.s2.st.map(x=>`<div class="stat"><div class="n">${x[0]}</div><div class="l">${x[1]}</div></div>`).join('')}</div>
      </div>
      <div style="flex:1; display:flex; justify-content:center; align-items:center"><img src="${ASSET.wmap}" class="wmap-img" alt="Bonnie weltweit"></div>
    </div>`, n:s=>s.s2.notes},

  {g:'g-sky', b:s=>`<div class="eyebrow">${s.s3.eyebrow}</div><h2>${s.s3.h2}</h2>
    <p class="lead" style="max-width:92%">${s.s3.lead}</p>
    <div class="cards c3" style="margin-top:2.6vh">${s.s3.c.map((x,i)=>`<div class="card">${ic(['wa','msg','clock'][i])}<div class="k">${x[0]}</div><p>${x[1]}</p></div>`).join('')}</div>`, n:s=>s.s3.notes},

  {g:'g-peach', b:s=>`<div class="split"><div>

/* ================= engine ================= */
const stage=document.getElementById('stage'), hud=document.getElementById('hud'), notesEl=document.getElementById('notes'), langEl=document.getElementById('lang'), helpEl=document.getElementById('help');
let i=0, lang='de', showNotes=false;
const LANGS=['de','en','nl'];
const PDFBASE='https://wboon-tech.github.io/bonnie-zenchef-dach/pdf/bonnie-zenchef-';

function renderLangBar(){ langEl.innerHTML=LANGS.map(l=>`<button class="${l===lang?'on':''}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join(''); }
function setLang(l){ lang=l; document.documentElement.lang=l; render(); }

function render(){
  const t=T[lang], sl=SLIDES[i];
  const fab = i<SLIDES.length-1 ? `<button class="fab" onclick="go(1)" aria-label="next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>`:'';
  stage.innerHTML=`<div class="slide active ${sl.g}">${sl.b(t)}<span class="pagenum">${i+1} / ${SLIDES.length}</span>${fab}</div>`;
  hud.textContent=`${i+1} / ${SLIDES.length}`;
  document.getElementById('pdfbtn').href=PDFBASE+lang+'.pdf';
  helpEl.textContent=t.help;
  notesEl.innerHTML=`<h4>Slide ${i+1} / ${SLIDES.length}</h4>${sl.n(t)}`;
  notesEl.classList.toggle('show', showNotes);
  renderLangBar();
}
function go(d){ i=Math.max(0,Math.min(SLIDES.length-1,i+d)); render(); }

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(-1);}
  else if(e.key==='Home'){i=0;render();}
  else if(e.key==='End'){i=SLIDES.length-1;render();}
  else if(e.key.toLowerCase()==='n'){showNotes=!showNotes;render();}
  else if(e.key.toLowerCase()==='l'){ setLang(LANGS[(LANGS.indexOf(lang)+1)%LANGS.length]); }
  else if(e.key.toLowerCase()==='f'){ if(!document.fullscreenElement)document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
});
function fromHash(){const p=location.hash.replace('#','').split('/');const h=parseInt(p[0],10);if(p[1]&&LANGS.includes(p[1]))lang=p[1];if(h>=1&&h<=SLIDES.length)i=h-1;}
window.addEventListener('hashchange',()=>{fromHash();render();});
fromHash(); render();
</script>
